# Environment camera (Intel RealSense D435, no IMU).
d435:
  serial: null            # null = first connected device
  color:
    width: 1280
    height: 720
    fps: 30
  depth:
    width: 1280
    height: 720
    fps: 30
  align_to_color: true    # depth is reprojected onto the color image grid
  warmup_frames: 30       # let auto-exposure settle before capturing
  # Fixed range for the colorized depth image sent to models, so every capture uses the same color scale.
  depth_vis_range_m: [0.2, 1.5]
