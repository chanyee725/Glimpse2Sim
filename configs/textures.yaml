# Textured materials a model may pick for `texture`, by name. Paths are under
# {NVIDIA_NUCLEUS_DIR}/Materials/Base/ on the Isaac Sim 6.2 asset server (each checked to exist, 2026-10-25).
# A texture replaces color_rgb, roughness and metallic with its own fixed colors, so only textures whose look
# does not depend on a color are listed (no plain colored plastic); plain-colored surfaces leave `texture` null.
# `color` is the texture's typical sRGB look: a texture whose color is far from the model's color_rgb is ignored.
oak_wood:            {path: Wood/Oak.mdl,                    looks_like: "light oak wood grain", color: [0.72, 0.53, 0.34]}
ash_wood:            {path: Wood/Ash.mdl,                    looks_like: "pale ash wood grain", color: [0.80, 0.68, 0.52]}
