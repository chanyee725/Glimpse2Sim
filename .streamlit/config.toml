[server]
# Watching would cover the whole project (.venv included) and hit the inotify limit, even with a blacklist.
# app.py reloads the glimpse2sim modules on every rerun instead, so edits show up after any click.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#78A9E4"
backgroundColor = "#1B2025"
secondaryBackgroundColor = "#232A30"
textColor = "#E4E9EC"
